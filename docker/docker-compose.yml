# ─────────────────────────────────────────────────────────────────────────────
# Knowledge Cards — tam yığın: Nextcloud + MariaDB + nextlibrary app'i.
#
# Kullanım (bu klasörde):
#   cp .env.example .env      # şifreleri DEĞİŞTİR
#   docker compose up -d --build
#   → http://localhost:8080  (NC_ADMIN_USER / NC_ADMIN_PASSWORD ile gir)
#
# Ayrıntı: KURULUM.md
# ─────────────────────────────────────────────────────────────────────────────
# Sabit proje adı: klasör adından ("docker") türetilen adla başka paketlerle
# çakışmasın diye. Konteynerler nextlibrary-* olarak adlanır.
name: nextlibrary

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  nextcloud:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nextlibrary-full:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # İlk açılışta Nextcloud otomatik kurulur (web sihirbazı gerekmez).
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_TRUSTED_DOMAINS:-localhost}
    volumes:
      - nc_data:/var/www/html

volumes:
  db_data:
  nc_data:
